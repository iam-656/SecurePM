services:
  postgres:
    image: postgres:16
    container_name: securepm-postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securepm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepm}
      POSTGRES_DB: ${POSTGRES_DB:-securepm}
    restart: unless-stopped
    ports:
      - "5432:5432"

  quarkus-app:
    build: ./backend
    container_name: securepm-app
    depends_on:
      - postgres
    volumes:
      - attachments:/data/attachments
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-securepm}
      QUARKUS_DATASOURCE_USERNAME: ${POSTGRES_USER:-securepm}
      QUARKUS_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-securepm}
      QUARKUS_PROFILE: prod
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-ChangeMeNow123!}
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: securepm-nginx
    depends_on:
      - quarkus-app
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - attachments:/data/attachments:ro
      - frontend-build:/usr/share/nginx/html:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: securepm-frontend
    volumes:
      - frontend-build:/usr/share/nginx/html
    restart: unless-stopped

volumes:
  pg_data:
  attachments:
  frontend-build:
