# Test profile: connect to running PostgreSQL container (docker-compose.yml)
quarkus.flyway.enabled=true
quarkus.flyway.migrate-at-start=true

quarkus.hibernate.orm.database.generation=none
quarkus.hibernate.orm.sql-load-script=no-load-script

# Connect to the running securepm-postgres container (no Dev Services / Docker-in-Docker needed)
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/securepm
quarkus.datasource.username=securepm
quarkus.datasource.password=securepm

# Test: cookies not secure (no HTTPS in tests)
quarkus.http.session.cookie.secure=false
